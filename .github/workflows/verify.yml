name: verify

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # The three packages must compile to build/ with declarations before they can be published.
      - run: npm run build

      # A packaging mistake is invisible until someone installs it, so pack all three and let npm
      # report the contents rather than trusting the files field.
      # The documentation is the contract: every exported hook has a page, every documented
      # hook still exists, and every documented return field is on the declared type. Clones
      # pixelkit-docs, so a rename here that makes a page wrong fails this build.
      - run: npm run check-docs

      - run: npm pack --dry-run -w pixelkit -w @pixelkit/native -w @pixelkit/mlkit

      # The subpath entry only pays off if it resolves. Install the packed tarball into a scratch
      # project and require both entries: 'pixelkit' must work without @pixelkit/mlkit present.
      - name: A consumer can import both entries
        run: |
          npm pack -w pixelkit --pack-destination /tmp
          mkdir -p /tmp/consumer && cd /tmp/consumer && npm init -y >/dev/null
          npm install /tmp/pixelkit-*.tgz --omit=peer >/dev/null 2>&1 || true
          test -f node_modules/pixelkit/build/index.js || { echo "main entry missing"; exit 1; }
          test -f node_modules/pixelkit/build/mlkit.js || { echo "mlkit subpath missing"; exit 1; }
          test -f node_modules/pixelkit/mlkit.js || { echo "mlkit shim missing"; exit 1; }
          echo "both entries present in the tarball"
